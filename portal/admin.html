<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Admin | Talento Consulting</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=3.3-102626">
<!-- Talento Client Portal Admin - v3 (102626): live inbox, two-way messages, client stars and notes -->
</head>
<body>
<div id="app"><div class="loading">Loading admin…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=3.3-102626"></script>
<script src="common.js?v=3.3-102626"></script>
<script>
const { sb, cfg, esc, fmtDate, ago, safeName, BRAND, STAGES, stagePill, statusPill, toast, openFile, live, debounce, isTyping, stamp } = TP;
const app = document.getElementById('app');
const STAGE_ALL = [...STAGES, 'On hold', 'Closed'];
const STATUS_ALL = ['Presented', 'Client interview', 'Final round', 'Offer', 'Hired', 'On hold', 'Declined', 'Withdrawn'];
const DOC_CATS = ['Job spec', 'Proposal', 'Market map', 'IQS report', 'Contract', 'General'];
let S = { clients: [], client: null, members: [], searches: [], candidates: [], docs: [], feedback: [], messages: [], marks: [], activity: [], tab: 'inbox', sel: null, drafts: {}, live: false, pending: false, unseen: 0 };

const opt = (list, v) => list.map((x) => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
const val = (id) => document.getElementById(id)?.value.trim() || null;

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = './'; return; }
  const { data: isAdmin } = await sb.rpc('is_admin');
  if (!isAdmin) { app.innerHTML = `<div class="loading">This page is for Talento admins only. <a href="./" style="margin-left:6px">Go to portal</a></div>`; return; }
  await loadClients(new URLSearchParams(location.search).get('client'));
}

async function loadClients(slug) {
  const { data } = await sb.from('clients').select('*').order('name');
  S.clients = data || [];
  const c = S.clients.find((x) => x.slug === slug) || S.client && S.clients.find((x) => x.id === S.client.id) || S.clients[0];
  if (c) await loadClient(c); else render();
}

async function loadClient(c) {
  S.client = c;
  history.replaceState(null, '', '?client=' + c.slug);
  await fetchClient(c);
  render();
  goLive();
}

async function fetchClient(c) {
  const [m, s, ca, d, f, msg, mk, act] = await Promise.all([
    sb.rpc('admin_list_members', { p_client_id: c.id }),
    sb.from('searches').select('*').eq('client_id', c.id).order('sort_order').order('created_at'),
    sb.from('candidates').select('*').eq('client_id', c.id).order('sort_order').order('created_at'),
    sb.from('documents').select('*').eq('client_id', c.id).order('created_at', { ascending: false }),
    sb.from('feedback_view').select('*').eq('client_id', c.id).order('created_at', { ascending: false }),
    sb.from('candidate_messages').select('*').eq('client_id', c.id).order('created_at'),
    sb.from('candidate_marks').select('*').eq('client_id', c.id),
    sb.from('activity').select('*').eq('client_id', c.id).order('created_at', { ascending: false }).limit(80)
  ]);
  S.members = m.data || []; S.searches = s.data || []; S.candidates = ca.data || []; S.docs = d.data || []; S.feedback = f.data || [];
  S.messages = msg.data || []; S.marks = mk.data || []; S.activity = act.data || [];
}

/* ---- Live: client messages, stars, notes and feedback land here as they happen ---- */
const refresh = debounce(async () => { if (!S.client) return; await fetchClient(S.client); safeRender(); }, 400);
function safeRender() {
  if (isTyping()) { S.pending = true; return; }
  S.pending = false; const y = window.scrollY; render(); window.scrollTo(0, y);
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.pending && !isTyping()) safeRender(); }, 150));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.unseen = 0; document.title = 'Portal Admin | Talento Consulting'; } });
function ping(text) {
  toast(text);
  if (document.hidden) { S.unseen++; document.title = '(' + S.unseen + ') Portal Admin | Talento Consulting'; }
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Talento portal', { body: text }); } catch (e) {}
}
function goLive() {
  live(S.client.id, (table, p) => {
    const r = p.new || {};
    const who = () => (S.candidates.find((c) => c.id === r.candidate_id) || {}).full_name || 'a candidate';
    if (p.eventType === 'INSERT' && table === 'candidate_messages' && !r.from_talento) ping((r.author_name || 'Client') + ' on ' + who() + ': ' + (r.body || '').slice(0, 90));
    if (p.eventType === 'INSERT' && table === 'feedback') ping('New feedback on ' + who());
    if (table === 'candidate_marks' && r.starred && !(p.old && p.old.starred)) ping('Client starred ' + who());
    refresh();
  }, (on) => { S.live = on; const d = document.getElementById('liveDot'); if (d) d.className = 'live' + (on ? ' on' : ''); });
}

function render() {
  const c = S.client;
  app.innerHTML = `
  <header class="topbar"><div class="topbar-in">
    <a class="brand" href="/">${BRAND}</a><span class="x">·</span><b>Portal admin</b>
    <div class="spacer"></div>
    <span id="liveDot" class="live${S.live ? ' on' : ''}" title="Client activity arrives automatically"><i></i>Live</span>
    ${'Notification' in window && Notification.permission === 'default' ? `<button class="btn btn-sm btn-ghost" id="notif">Turn on alerts</button>` : ''}
    ${c ? `<a class="btn btn-sm btn-ghost" href="./?client=${esc(c.slug)}">View as client</a>` : ''}
    <button class="btn btn-sm btn-primary" id="out">Sign out</button>
  </div></header>
  <main class="wrap"><div class="admin-grid">
    <aside>
      <div class="eyebrow" style="margin-bottom:10px">Clients</div>
      <div class="side-list">${S.clients.map((x) => `<button data-client="${x.id}" class="${c && x.id === c.id ? 'on' : ''}">${esc(x.name)}${x.active ? '' : ' <span class="meta">(inactive)</span>'}</button>`).join('')}</div>
      <div class="card" style="margin-top:16px;padding:16px">
        <b>New client</b>
        <label class="field" style="margin-top:10px"><span>Name</span><input id="nc_name" placeholder="Acme Inc"></label>
        <button class="btn btn-sm btn-primary" id="nc_go">Add client</button>
      </div>
    </aside>
    <section>${c ? clientPanel(c) : '<div class="empty">Add your first client.</div>'}</section>
  </div></main>`;
  wire();
}

function clientPanel(c) {
  const t = (id, l) => `<button class="tab ${S.tab === id ? 'on' : ''}" data-tab="${id}">${l}</button>`;
  return `
  <div class="hero" style="margin-bottom:12px"><div><div class="eyebrow">Client</div><h1 style="font-size:30px">${esc(c.name)}</h1>
    <p class="meta">Portal link: ${esc(location.origin)}/portal/?client=${esc(c.slug)}</p></div></div>
  <nav class="tabs">${t('inbox', 'Live inbox' + (unanswered() ? ' (' + unanswered() + ')' : ''))}${t('searches', 'Searches')}${t('candidates', 'Candidates')}${t('documents', 'Documents')}${t('feedback', 'Feedback (' + S.feedback.length + ')')}${t('people', 'Client logins')}${t('settings', 'Branding')}</nav>
  ${({ inbox: tabInbox, searches: tabSearches, candidates: tabCands, documents: tabDocs, feedback: tabFeedback, people: tabPeople, settings: tabSettings })[S.tab]()}`;
}

/* ---- Live inbox ---- */
const memberName = (uid) => (S.members.find((m) => m.user_id === uid) || {}).full_name || (S.members.find((m) => m.user_id === uid) || {}).email || 'Talento';
const lastAt = (cid) => [...S.messages.filter((m) => m.candidate_id === cid).map((m) => m.created_at), ...S.marks.filter((m) => m.candidate_id === cid).map((m) => m.updated_at), ...S.feedback.filter((f) => f.candidate_id === cid).map((f) => f.created_at)].sort().pop() || '';
const needsReply = (cid) => { const t = S.messages.filter((m) => m.candidate_id === cid); return t.length && !t[t.length - 1].from_talento; };
const unanswered = () => S.candidates.filter((c) => needsReply(c.id)).length;
function tabInbox() {
  if (!S.candidates.length) return `<div class="empty">Present candidates first. Client messages, stars and feedback on them land here live.</div>`;
  const list = [...S.candidates].sort((a, b) => (needsReply(b.id) - needsReply(a.id)) || lastAt(b.id).localeCompare(lastAt(a.id)));
  if (!S.sel || !S.candidates.some((c) => c.id === S.sel)) S.sel = list[0].id;
  const c = S.candidates.find((x) => x.id === S.sel);
  const thread = S.messages.filter((m) => m.candidate_id === c.id);
  const marks = S.marks.filter((m) => m.candidate_id === c.id && (m.starred || m.note));
  const fb = S.feedback.filter((f) => f.candidate_id === c.id);
  return `<div class="inbox">
    <div class="inbox-list">${list.map((x) => {
      const t = S.messages.filter((m) => m.candidate_id === x.id), last = t[t.length - 1];
      const st = S.marks.filter((m) => m.candidate_id === x.id && m.starred).length;
      return `<button data-sel="${x.id}" class="${x.id === c.id ? 'on' : ''}"><b>${esc(x.full_name)}${needsReply(x.id) ? ' <span class="badge">reply</span>' : ''}${st ? ` <span style="color:#d97706">★${st}</span>` : ''}</b>
        <span class="meta">${esc(S.searches.find((s) => s.id === x.search_id)?.title || '')} · ${esc(x.status)}</span>
        <span class="snip">${last ? esc(last.author_name + ': ' + last.body) : fb.length && x.id === c.id ? '' : 'No messages yet'}</span></button>`;
    }).join('')}</div>
    <div class="card">
      <div class="card-head"><div><h3>${esc(c.full_name)}</h3><div class="meta">${esc([c.current_title, c.current_company].filter(Boolean).join(' at '))} · ${esc(S.searches.find((s) => s.id === c.search_id)?.title || '')}</div></div>${statusPill(c.status)}</div>
      ${marks.length ? marks.map((m) => `<div class="client-marks">${m.starred ? '<b style="color:#d97706">★ Starred</b> ' : ''}<b>${esc(memberName(m.user_id))}</b>${m.note ? ': ' + esc(m.note) : ''} <span class="meta">· ${ago(m.updated_at)}</span></div>`).join('') : ''}
      ${fb.length ? fb.map((f) => `<div class="client-marks"><b>${esc(f.author_name)}</b> gave feedback${f.recommendation || f.decision ? ': ' + esc(f.recommendation || (f.decision === 'Decline' ? 'Pass' : f.decision)) : ''}${f.comment ? ' · ' + esc(f.comment) : ''} <span class="meta">· ${ago(f.created_at)}</span></div>`).join('') : ''}
      <div class="thread" style="margin-top:12px">
        ${thread.length ? thread.map((m) => `<div class="msg-b ${m.from_talento ? 'me' : 'them'}"><div class="who-l">${esc(m.author_name || '')} · ${stamp(m.created_at)}</div>${esc(m.body)}</div>`).join('') : `<div class="meta">No messages on ${esc(c.full_name.split(' ')[0])} yet. Start the conversation, ${esc(S.client.name)} sees it instantly.</div>`}
        <div class="composer"><textarea id="reply" rows="2" placeholder="Reply to ${esc(S.client.name)} about ${esc(c.full_name.split(' ')[0])}…">${esc(S.drafts[c.id] || '')}</textarea><button class="btn btn-sm btn-primary" id="reply_go">Send</button></div>
        <div class="meta">Ctrl or Cmd + Enter sends.</div>
      </div>
    </div>
  </div>
  <div class="section" style="margin-top:20px"><h2>Activity</h2>
    ${S.activity.length ? `<div class="card feed">${S.activity.map((a) => `<div class="feed-i"><span class="feed-ic">•</span><div><div>${esc(a.message)}</div><div class="meta">${esc(a.actor || '')}${a.actor ? ' · ' : ''}${stamp(a.created_at)}</div></div>${a.candidate_id ? `<button class="btn-link" data-sel="${a.candidate_id}">Open</button>` : ''}</div>`).join('')}</div>` : '<div class="empty">Nothing yet.</div>'}
  </div>`;
}

/* ---- Searches ---- */
function tabSearches() {
  return `<div class="section card"><h2>Add a search</h2>
    <div class="form-row">
      <label class="field"><span>Role title</span><input id="ns_title" placeholder="VP Sales, North America"></label>
      <label class="field"><span>Reference</span><input id="ns_ref" placeholder="TAL-ABC-2601"></label>
      <label class="field"><span>Hiring manager</span><input id="ns_hm" placeholder="Full name"></label>
      <label class="field"><span>Location</span><input id="ns_loc" placeholder="Remote US"></label>
      <label class="field"><span>Compensation</span><input id="ns_comp" placeholder="$250k OTE"></label>
      <label class="field"><span>Stage</span><select id="ns_stage">${opt(STAGE_ALL, 'Kickoff')}</select></label>
    </div>
    <label class="field"><span>Summary (optional)</span><input id="ns_sum"></label>
    <button class="btn btn-sm btn-primary" id="ns_go">Add search</button></div>
  ${S.searches.length ? `<div class="card"><table class="table"><thead><tr><th style="width:24%">Role</th><th>Stage</th><th style="width:34%">Next steps (client sees this)</th><th>Location / comp</th><th></th></tr></thead><tbody>
    ${S.searches.map((s) => `<tr data-row="${s.id}">
      <td><input data-f="title" value="${esc(s.title)}"><input data-f="ref" value="${esc(s.ref || '')}" placeholder="Reference" style="margin-top:6px"><input data-f="hiring_manager" value="${esc(s.hiring_manager || '')}" placeholder="Hiring manager" style="margin-top:6px"><textarea data-f="summary" rows="2" placeholder="Summary" style="margin-top:6px">${esc(s.summary || '')}</textarea></td>
      <td><select data-f="stage">${opt(STAGE_ALL, s.stage)}</select><div class="meta" style="margin-top:6px">Updated ${ago(s.updated_at)}</div></td>
      <td><textarea data-f="next_steps" rows="3">${esc(s.next_steps || '')}</textarea></td>
      <td><input data-f="location" value="${esc(s.location || '')}" placeholder="Location"><input data-f="compensation" value="${esc(s.compensation || '')}" placeholder="Comp" style="margin-top:6px"></td>
      <td style="white-space:nowrap"><button class="btn btn-sm btn-primary" data-save="searches">Save</button> <button class="btn-link" data-del="searches" style="color:var(--red)">Delete</button></td>
    </tr>`).join('')}</tbody></table></div>` : ''}`;
}

/* ---- Candidates ---- */
function tabCands() {
  if (!S.searches.length) return `<div class="empty">Add a search first, then present candidates against it.</div>`;
  return `<div class="section card"><h2>Present a candidate</h2>
    <div class="form-row">
      <label class="field"><span>Search</span><select id="nca_search">${S.searches.map((s) => `<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></label>
      <label class="field"><span>Full name</span><input id="nca_name"></label>
      <label class="field"><span>Current title</span><input id="nca_title"></label>
      <label class="field"><span>Current company</span><input id="nca_co"></label>
      <label class="field"><span>Location</span><input id="nca_loc"></label>
      <label class="field"><span>LinkedIn URL</span><input id="nca_li"></label>
    </div>
    <label class="field"><span>Summary for the client</span><textarea id="nca_sum" rows="3"></textarea></label>
    <label class="field"><span>IQS™ report (PDF, optional)</span><input type="file" id="nca_file" accept=".pdf,.doc,.docx"></label>
    <button class="btn btn-sm btn-primary" id="nca_go">Add candidate</button></div>
  ${S.candidates.length ? `<div class="card"><table class="table"><thead><tr><th style="width:26%">Candidate</th><th>Status</th><th style="width:30%">Summary</th><th>Resume / IQS™</th><th>Visible</th><th></th></tr></thead><tbody>
    ${S.candidates.map((c) => `<tr data-row="${c.id}">
      <td><input data-f="full_name" value="${esc(c.full_name)}"><input data-f="current_title" value="${esc(c.current_title || '')}" placeholder="Title" style="margin-top:6px"><input data-f="current_company" value="${esc(c.current_company || '')}" placeholder="Company" style="margin-top:6px">
        <div class="meta" style="margin-top:6px">${esc(S.searches.find((s) => s.id === c.search_id)?.title || '')}${S.marks.some((m) => m.candidate_id === c.id && m.starred) ? ' · <b style="color:#d97706">★ ' + S.marks.filter((m) => m.candidate_id === c.id && m.starred).length + '</b>' : ''} · <button class="btn-link" data-sel="${c.id}">Messages</button></div></td>
      <td>${c.ats_id ? `${statusPill(c.status)}<div class="meta" style="margin-top:6px">Set by the ATS</div>` : `<select data-f="status">${opt(STATUS_ALL, c.status)}</select>`}</td>
      <td><textarea data-f="summary" rows="4">${esc(c.summary || '')}</textarea><input data-f="linkedin_url" value="${esc(c.linkedin_url || '')}" placeholder="LinkedIn URL" style="margin-top:6px"></td>
      <td><div class="meta">Resume</div>${c.resume_path ? `<button class="btn-link" data-file="${esc(c.resume_path)}">Open resume</button><br>` : ''}<input type="file" data-resume="${c.id}" accept=".pdf,.doc,.docx" style="font-size:12px;border:0;padding:4px 0">
        <div class="meta" style="margin-top:6px">IQS™ report</div>${c.iqs_report_path ? `<button class="btn-link" data-file="${esc(c.iqs_report_path)}">Open</button><br>` : ''}<input type="file" data-iqs="${c.id}" accept=".pdf,.doc,.docx" style="font-size:12px;border:0;padding:4px 0"></td>
      <td><input type="checkbox" data-f="visible_to_client" ${c.visible_to_client ? 'checked' : ''} style="width:auto"></td>
      <td style="white-space:nowrap"><button class="btn btn-sm btn-primary" data-save="candidates">Save</button> <button class="btn-link" data-del="candidates" style="color:var(--red)">Delete</button></td>
    </tr>`).join('')}</tbody></table></div>` : ''}`;
}

/* ---- Documents ---- */
function tabDocs() {
  return `<div class="section card"><h2>Share a document</h2>
    <div class="form-row">
      <label class="field"><span>Title</span><input id="nd_title" placeholder="VP Sales job spec v2"></label>
      <label class="field"><span>Type</span><select id="nd_cat">${opt(DOC_CATS, 'Job spec')}</select></label>
      <label class="field"><span>Search (optional)</span><select id="nd_search"><option value="">None</option>${S.searches.map((s) => `<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>File</span><input type="file" id="nd_file"></label>
    <button class="btn btn-sm btn-primary" id="nd_go">Upload &amp; share</button></div>
  ${S.docs.length ? `<div class="card"><table class="table"><thead><tr><th>Title</th><th>Type</th><th>Added</th><th>Visible</th><th></th></tr></thead><tbody>
    ${S.docs.map((d) => `<tr data-row="${d.id}"><td><input data-f="title" value="${esc(d.title)}"></td><td><select data-f="category">${opt(DOC_CATS, d.category)}</select></td>
      <td class="meta">${fmtDate(d.created_at)}</td><td><input type="checkbox" data-f="visible_to_client" ${d.visible_to_client ? 'checked' : ''} style="width:auto"></td>
      <td style="white-space:nowrap"><button class="btn-link" data-file="${esc(d.storage_path)}">Open</button> · <button class="btn btn-sm btn-primary" data-save="documents">Save</button> <button class="btn-link" data-del="documents" style="color:var(--red)">Delete</button></td></tr>`).join('')}
  </tbody></table></div>` : ''}`;
}

/* ---- Feedback ---- */
function tabFeedback() {
  if (!S.feedback.length) return `<div class="empty">No client feedback yet.</div>`;
  return `<div class="card"><table class="table"><thead><tr><th>When</th><th>Candidate</th><th>From</th><th>Decision</th><th>Comment</th></tr></thead><tbody>
    ${S.feedback.map((f) => `<tr><td class="meta">${ago(f.created_at)}</td><td><b>${esc(S.candidates.find((c) => c.id === f.candidate_id)?.full_name || '')}</b></td>
      <td>${esc(f.author_name)}</td><td>${f.decision ? `<span class="pill ${({ Advance: 'green', Hold: 'amber', Decline: 'grey' })[f.decision]}">${f.decision === 'Decline' ? 'Pass' : esc(f.decision)}</span>` : ''}</td><td>${esc(f.comment || '')}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---- People ---- */
function tabPeople() {
  return `<div class="section card"><h2>Give someone access</h2>
    <div class="note"><b>Step 1.</b> In Supabase go to Authentication → Users → Add user → <b>Send invitation</b> and enter their email.<br>
    <b>Step 2.</b> Link that email to ${esc(S.client.name)} below. They’ll get the invite, set a password and land straight in this portal.</div>
    <div class="form-row">
      <label class="field"><span>Email</span><input id="np_email" type="email"></label>
      <label class="field"><span>Full name</span><input id="np_name"></label>
      <label class="field"><span>Job title</span><input id="np_title"></label>
    </div>
    <button class="btn btn-sm btn-primary" id="np_go">Link to ${esc(S.client.name)}</button></div>
  ${S.members.length ? `<div class="card"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Title</th><th>Last sign-in</th><th></th></tr></thead><tbody>
    ${S.members.map((m) => `<tr><td><b>${esc(m.full_name || '')}</b></td><td>${esc(m.email)}</td><td>${esc(m.job_title || '')}</td><td class="meta">${m.last_sign_in_at ? ago(m.last_sign_in_at) : 'Not yet'}</td>
      <td><button class="btn-link" data-unlink="${m.user_id}" style="color:var(--red)">Remove access</button></td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">No client logins yet.</div>'}`;
}

/* ---- Settings ---- */
function tabSettings() {
  const c = S.client;
  return `<div class="card"><h2 style="margin-top:0">Branding &amp; details</h2>
    <div class="form-row">
      <label class="field"><span>Client name</span><input id="cs_name" value="${esc(c.name)}"></label>
      <label class="field"><span>URL slug</span><input id="cs_slug" value="${esc(c.slug)}"></label>
      <label class="field"><span>Logo URL</span><input id="cs_logo" value="${esc(c.logo_url || '')}" placeholder="https://…/logo.png"></label>
      <label class="field"><span>Primary colour</span><input id="cs_p" type="color" value="${esc(c.primary_color || '#1A5CE8')}" style="height:44px;padding:4px"></label>
      <label class="field"><span>Accent colour</span><input id="cs_a" type="color" value="${esc(c.accent_color || '#E8572A')}" style="height:44px;padding:4px"></label>
    </div>
    <label class="field"><span>Welcome message</span><textarea id="cs_wel" rows="2">${esc(c.welcome_message || '')}</textarea></label>
    <div class="form-row">
      <label class="field"><span>Talento contact name</span><input id="cs_cn" value="${esc(c.talento_contact_name || '')}"></label>
      <label class="field"><span>Talento contact email</span><input id="cs_ce" value="${esc(c.talento_contact_email || '')}"></label>
      <label class="field"><span>Status</span><select id="cs_act"><option value="1" ${c.active ? 'selected' : ''}>Active</option><option value="0" ${c.active ? '' : 'selected'}>Inactive (hidden)</option></select></label>
    </div>
    <button class="btn btn-sm btn-primary" id="cs_go">Save branding</button></div>`;
}

/* ---- Actions ---- */
async function upload(file, folder) {
  const path = `${S.client.id}/${folder}/${Date.now()}-${safeName(file.name)}`;
  const { error } = await sb.storage.from(cfg.bucket).upload(path, file, { upsert: false, contentType: file.type || undefined });
  if (error) { toast('Upload failed: ' + error.message); return null; }
  return path;
}
const done = (error, msg) => { if (error) { toast('Error: ' + error.message); return false; } toast(msg); return true; };

function wire() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('out', async () => { await sb.auth.signOut(); location.href = './'; });
  document.querySelectorAll('[data-client]').forEach((b) => (b.onclick = () => loadClient(S.clients.find((c) => c.id === b.dataset.client))));
  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { S.tab = b.dataset.tab; render(); }));
  document.querySelectorAll('[data-file]').forEach((b) => (b.onclick = () => openFile(b.dataset.file)));
  on('notif', async () => { try { await Notification.requestPermission(); } catch (e) {} render(); });
  document.querySelectorAll('[data-sel]').forEach((b) => (b.onclick = () => { S.sel = b.dataset.sel; S.tab = 'inbox'; render(); window.scrollTo(0, 0); }));
  const rp = document.getElementById('reply');
  if (rp) {
    rp.oninput = () => { S.drafts[S.sel] = rp.value; };
    rp.onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) document.getElementById('reply_go').click(); };
  }
  on('reply_go', async (e) => {
    const body = (S.drafts[S.sel] || '').trim(); if (!body) return toast('Write a reply first');
    e.target.disabled = true;
    const { error } = await sb.from('candidate_messages').insert({ candidate_id: S.sel, body });
    if (error) { e.target.disabled = false; return toast('Error: ' + error.message); }
    delete S.drafts[S.sel]; document.activeElement?.blur(); toast('Sent'); refresh();
  });

  on('nc_go', async () => {
    const name = val('nc_name'); if (!name) return toast('Add a name');
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const { error } = await sb.from('clients').insert({ name, slug, welcome_message: 'Welcome to your Talento search portal. Live status on every search, your shortlist and all documents in one place.' });
    if (done(error, name + ' added')) { S.tab = 'settings'; loadClients(slug); }
  });

  on('ns_go', async () => {
    const title = val('ns_title'); if (!title) return toast('Add a role title');
    const { error } = await sb.from('searches').insert({ client_id: S.client.id, title, location: val('ns_loc'), compensation: val('ns_comp'), stage: val('ns_stage'), summary: val('ns_sum'), ref: val('ns_ref'), hiring_manager: val('ns_hm'), sort_order: S.searches.length });
    if (done(error, 'Search added')) loadClient(S.client);
  });

  on('nca_go', async (e) => {
    const full_name = val('nca_name'); if (!full_name) return toast('Add a name');
    e.target.disabled = true;
    const f = document.getElementById('nca_file').files[0];
    const iqs_report_path = f ? await upload(f, 'iqs') : null;
    const { error } = await sb.from('candidates').insert({ search_id: val('nca_search'), client_id: S.client.id, full_name, current_title: val('nca_title'), current_company: val('nca_co'), location: val('nca_loc'), linkedin_url: val('nca_li'), summary: val('nca_sum'), iqs_report_path });
    e.target.disabled = false;
    if (done(error, 'Candidate presented')) loadClient(S.client);
  });

  document.querySelectorAll('[data-resume]').forEach((inp) => (inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const c = S.candidates.find((x) => x.id === inp.dataset.resume);
    const path = `${S.client.id}/resumes/${(c.ats_id || c.id)}-${Date.now()}.${(f.name.split('.').pop() || 'pdf').toLowerCase()}`;
    const { error: ue } = await sb.storage.from(cfg.bucket).upload(path, f, { upsert: false, contentType: f.type || undefined });
    if (ue) return toast('Upload failed: ' + ue.message);
    const { error } = await sb.from('candidates').update({ resume_path: path, resume_name: f.name }).eq('id', c.id);
    if (done(error, 'Resume attached')) loadClient(S.client);
  }));
  document.querySelectorAll('[data-iqs]').forEach((inp) => (inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const path = await upload(f, 'iqs'); if (!path) return;
    const { error } = await sb.from('candidates').update({ iqs_report_path: path }).eq('id', inp.dataset.iqs);
    if (done(error, 'IQS™ report attached')) loadClient(S.client);
  }));

  on('nd_go', async (e) => {
    const f = document.getElementById('nd_file').files[0]; if (!f) return toast('Choose a file');
    e.target.disabled = true;
    const path = await upload(f, 'docs');
    if (!path) { e.target.disabled = false; return; }
    const { error } = await sb.from('documents').insert({ client_id: S.client.id, search_id: val('nd_search'), title: val('nd_title') || f.name, category: val('nd_cat'), storage_path: path });
    if (done(error, 'Document shared')) loadClient(S.client);
  });

  document.querySelectorAll('[data-save]').forEach((b) => (b.onclick = async () => {
    const row = b.closest('[data-row]'); const patch = {};
    row.querySelectorAll('[data-f]').forEach((el) => { patch[el.dataset.f] = el.type === 'checkbox' ? el.checked : (el.value.trim() || null); });
    const { error } = await sb.from(b.dataset.save).update(patch).eq('id', row.dataset.row);
    if (done(error, 'Saved')) loadClient(S.client);
  }));

  document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    if (!confirm('Delete this permanently?')) return;
    const { error } = await sb.from(b.dataset.del).delete().eq('id', b.closest('[data-row]').dataset.row);
    if (done(error, 'Deleted')) loadClient(S.client);
  }));

  on('np_go', async () => {
    const email = val('np_email'); if (!email) return toast('Add an email');
    const { data, error } = await sb.rpc('admin_add_member', { p_email: email, p_client_id: S.client.id, p_full_name: val('np_name'), p_job_title: val('np_title') });
    if (error) return toast('Error: ' + error.message);
    if (data === 'NO_USER') return toast('Invite that email in Supabase first (step 1)');
    toast('Access granted'); loadClient(S.client);
  });

  document.querySelectorAll('[data-unlink]').forEach((b) => (b.onclick = async () => {
    if (!confirm('Remove this person’s access to ' + S.client.name + '?')) return;
    const { error } = await sb.from('client_members').delete().eq('client_id', S.client.id).eq('user_id', b.dataset.unlink);
    if (done(error, 'Access removed')) loadClient(S.client);
  }));

  on('cs_go', async () => {
    const patch = { name: val('cs_name'), slug: val('cs_slug'), logo_url: val('cs_logo'), primary_color: val('cs_p'), accent_color: val('cs_a'), welcome_message: val('cs_wel'), talento_contact_name: val('cs_cn'), talento_contact_email: val('cs_ce'), active: val('cs_act') === '1' };
    const { error } = await sb.from('clients').update(patch).eq('id', S.client.id);
    if (done(error, 'Branding saved')) loadClients(patch.slug);
  });
}

boot();
</script>
</body>
</html>
